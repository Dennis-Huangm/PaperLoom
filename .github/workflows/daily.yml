name: PaperLoom daily research digest

on:
  schedule:
    # 07:30 Asia/Shanghai, Monday-Friday. GitHub Actions cron uses UTC.
    - cron: "30 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Require personal configuration
        run: test -f config.yaml || (echo "Commit a personalized config.yaml first." && exit 1)
      - name: Restore recommendation and tracking state
        uses: actions/cache/restore@v4
        with:
          path: |
            run/state*.json
            run/feedback-*.json
            run/version-state-*.json
            run/weekly/
            run/????-??-??/recommendations.json
          key: arxiv-ra-run-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            arxiv-ra-run-${{ runner.os }}-
      - name: Generate digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: paperloom --config config.yaml run
      - name: Save recommendation and tracking state
        uses: actions/cache/save@v4
        with:
          path: |
            run/state*.json
            run/feedback-*.json
            run/version-state-*.json
            run/weekly/
            run/????-??-??/recommendations.json
          key: arxiv-ra-run-${{ runner.os }}-${{ github.run_id }}
      - name: Upload private report artifact
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-digest-${{ github.run_id }}
          path: run/
          if-no-files-found: error
          retention-days: 30
